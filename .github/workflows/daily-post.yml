name: Post Instagram quotidien Simple Toys

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch: {}

concurrency:
  group: instagram-daily-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram-bot
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dependances
        run: npm install

      - name: Etape 1 - Generer l'image et la legende du post
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node index.js

      - name: Committer et pousser l'image generee
        run: |
          git config user.name "simpletoys-bot"
          git config user.email "bot@simpletoys.local"
          git add posts/ data/pending.json
          git commit -m "Post automatique" || echo "Rien a committer"
          git pull --rebase origin main
          git push

      - name: Forcer jsDelivr a recuperer la nouvelle image
        run: |
          curl -s "https://purge.jsdelivr.net/gh/Elwab009/simpel-toys@main/instagram-bot/posts/" > /dev/null
          sleep 15

      - name: Etape 2 - Publier via le webhook Make.com
        env:
          MODE: publish
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: node index.js

      - name: Committer la mise a jour de l'historique
        run: |
          git config user.name "simpletoys-bot"
          git config user.email "bot@simpletoys.local"
          git add data/history.json data/pending.json
          git commit -m "Mise a jour historique" || echo "Rien a committer"
          git pull --rebase origin main
          git push
