name: Post Instagram quotidien Simple Toys

on:
  schedule:
    # 10h00 heure du Maroc (UTC+0/+1 selon saison) -> 9h00 UTC, ajustable
    - cron: '0 9 * * *'
  workflow_dispatch: {} # permet aussi de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write # necessaire pour que le bot committe l'image generee

jobs:
  post:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram-bot
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dependances
        run: npm install

      - name: Etape 1 - Generer l'image et la legende du jour
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node index.js
        # MODE par defaut = 'generate'

      - name: Committer et pousser l'image generee
        run: |
          git config user.name "simpletoys-bot"
          git config user.email "bot@simpletoys.local"
          git add posts/ data/pending.json
          git commit -m "🧸 Post automatique du $(date +'%Y-%m-%d')" || echo "Rien a committer"
          git push

      - name: Attendre que GitHub rende l'image accessible publiquement
        run: sleep 20

      - name: Etape 2 - Publier via le webhook Make.com
        env:
          MODE: publish
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: node index.js

      - name: Committer la mise a jour de l'historique
        run: |
          git config user.name "simpletoys-bot"
          git config user.email "bot@simpletoys.local"
          git add data/history.json data/pending.json
          git commit -m "🗂️ Mise a jour historique anti-repetition" || echo "Rien a committer"
          git push
